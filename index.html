    <script>
      // Apply the theme before first paint so the page never flashes the wrong one.
      // A saved choice wins; otherwise start in light mode.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') theme = 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
